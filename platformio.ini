[platformio]
default_envs = codecell-c3

[env:codecell-c3]
# pioarduino platform release bundling Arduino core 3.2.0, with native
# darwin_arm64 toolchains (the stock espressif32 pin shipped x86_64-only).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/microbotsio/CodeCell.git#main
    bblanchon/ArduinoJson @ ^6.21.0
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.7.0

build_flags =
    -DCODECELL_C3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

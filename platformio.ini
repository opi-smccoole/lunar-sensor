[platformio]
default_envs = codecell-c3

[env:codecell-c3]
platform = espressif32
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.2.0/esp32-3.2.0.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/microbotsio/CodeCell.git#main
    bblanchon/ArduinoJson @ ^6.21.0

build_flags =
    -DCODECELL_C3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
